# WeChat chat history, downloaded media, favorites, contacts, and account data
# live outside this standard bundle cache. The application must be closed so
# that it cannot replace cache files while cleanup is in progress.
id = "app.wechat-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = ["WeChat"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.tencent.xinWeChat", "WeChat"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/com.tencent.xinWeChat"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only WeChat's bundle directory under Library/Caches, which Apple designates for discardable files; sandbox Documents, Application Support, messages, accounts, and downloaded files remain outside the root"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://developer.apple.com/documentation/foundation/url/cachesdirectory"]
