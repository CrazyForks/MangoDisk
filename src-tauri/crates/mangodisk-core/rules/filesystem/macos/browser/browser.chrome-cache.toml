id = "browser.chrome-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["Google Chrome"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.google.Chrome", "Google Chrome"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/Google/Chrome"

[[roots]]
template = "${application_support}/Google/Chrome"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "GrShaderCache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only named renderer and network cache directories from Chrome's user-data profiles; cookies, history, passwords, bookmarks, extensions, and other profile data remain outside the selected suffixes"
verified_at = "2026-07-18"
verified_platform = "macos"
references = [
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
  "https://support.google.com/accounts/answer/32050",
]
