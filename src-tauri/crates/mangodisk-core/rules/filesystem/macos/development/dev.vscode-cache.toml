id = "dev.vscode-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "development"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Visual Studio Code", "Code"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${application_support}/Code/Cache"

[[roots]]
template = "${application_support}/Code/CachedExtensions"

[[roots]]
template = "${application_support}/Code/CachedData"

[[roots]]
template = "${application_support}/Code/GPUCache"

[[roots]]
template = "${application_support}/Code/Code Cache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only directories explicitly named Cache, CachedData, CachedExtensions, GPUCache, and Code Cache under VS Code's user-data directory; User settings, workspace storage, extensions, and backups are excluded"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://code.visualstudio.com/docs/configure/command-line#_advanced-cli-options"]
