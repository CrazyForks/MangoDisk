# Game installations and downloaded game data are excluded. The rule targets
# only embedded browser caches used by launcher storefront interfaces.
id = "app.game-launcher-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
required_stopped_processes = ["EpicGamesLauncher.exe", "UbisoftConnect.exe", "upc.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Epic Games Launcher", "Ubisoft Connect"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/EpicGamesLauncher/Saved"
kind = "childDirectories"
child_prefixes = ["webcache"]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache"]

[[roots]]
template = "${local_app_data}/EpicGamesLauncher/Saved/Logs"

[[roots]]
template = "${local_app_data}/EpicGamesLauncher/Saved/Crashes"
verified_rebuildable = true

[[roots]]
template = "${local_app_data}/Ubisoft Game Launcher/cache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Epic and Ubisoft launcher web-cache boundaries re-authored from their Windows application layouts; installed games are excluded"
verified_at = "2026-07-18"
verified_platform = "windows"
